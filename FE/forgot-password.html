<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - Chat App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="forgot-password-page" class="page active">
        <div class="auth-container">
            <div class="auth-header">
                <h1>Quên mật khẩu</h1>
                <p>Nhập email để nhận mã OTP đặt lại mật khẩu</p>
            </div>

            <!-- Step 1: Request OTP -->
            <div id="step-request-otp" class="reset-step active">
                <form id="requestOTPForm">
                    <div class="form-group">
                        <label for="reset-email">
                            <i class="fas fa-envelope"></i> Email
                        </label>
                        <input type="email" id="reset-email" class="form-input" placeholder="example@email.com" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fas fa-paper-plane"></i> Gửi mã OTP
                    </button>
                </form>
            </div>

            <!-- Step 2: Verify OTP -->
            <div id="step-verify-otp" class="reset-step">
                <p class="info-text">Mã OTP đã được gửi đến email: <strong id="display-email"></strong></p>
                <form id="verifyOTPForm">
                    <div class="form-group">
                        <label for="otp-code">
                            <i class="fas fa-key"></i> Mã OTP (6 số)
                        </label>
                        <input type="text" id="otp-code" class="form-input otp-input" placeholder="000000" maxlength="6" required pattern="[0-9]{6}">
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fas fa-check"></i> Xác nhận OTP
                    </button>

                    <button type="button" class="btn btn-secondary btn-block" id="resendOTPBtn">
                        <i class="fas fa-redo"></i> <span id="resend-text">Gửi lại mã OTP</span>
                    </button>
                    <p class="timer-text" id="otp-timer" style="text-align: center; margin-top: 10px; color: #5865F2;"></p>
                </form>
            </div>

            <!-- Step 3: Reset Password -->
            <div id="step-reset-password" class="reset-step">
                <p class="success-text">
                    <i class="fas fa-check-circle"></i> Mã OTP hợp lệ!
                </p>
                <form id="resetPasswordForm">
                    <div class="form-group">
                        <label for="new-password">
                            <i class="fas fa-lock"></i> Mật khẩu mới
                        </label>
                        <input type="password" id="new-password" class="form-input" placeholder="Nhập mật khẩu mới" required minlength="6">
                    </div>

                    <div class="form-group">
                        <label for="confirm-new-password">
                            <i class="fas fa-lock"></i> Xác nhận mật khẩu
                        </label>
                        <input type="password" id="confirm-new-password" class="form-input" placeholder="Nhập lại mật khẩu" required minlength="6">
                    </div>

                    <button type="submit" class="btn btn-success btn-block">
                        <i class="fas fa-save"></i> Đặt lại mật khẩu
                    </button>
                </form>
            </div>

            <div class="auth-footer">
                <p>Nhớ mật khẩu? <a href="login.html">Đăng nhập</a></p>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script type="module" src="js/pages/forgotPassword.js"></script>
</body>
</html>
