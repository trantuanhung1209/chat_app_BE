<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Main App -->
    <div id="app-page" class="page active">
        <div class="app-container">
            <!-- Sidebar -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <h2>Chat App</h2>
                    <div class="user-info">
                        <div class="user-avatar" id="currentUserAvatar"></div>
                        <span id="currentUsername"></span>
                    </div>
                </div>

                <div class="sidebar-nav">
                    <button class="nav-btn active" data-view="friends">
                        <i class="fas fa-user-friends"></i> Bạn bè
                    </button>
                    <button class="nav-btn" data-view="requests">
                        <i class="fas fa-envelope"></i> Lời mời
                        <span class="badge" id="requestBadge">0</span>
                    </button>
                    <button class="nav-btn" data-view="add-friend">
                        <i class="fas fa-user-plus"></i> Thêm bạn
                    </button>
                    <button class="nav-btn" data-view="profile">
                        <i class="fas fa-user"></i> Hồ sơ
                    </button>
                </div>

                <button class="logout-btn" id="logoutBtn">Đăng xuất</button>
            </div>

            <!-- Main Content -->
            <div class="main-content">
                <!-- Friends View -->
                <div id="friends-view" class="view active">
                    <div class="view-header">
                        <h3>Danh sách bạn bè</h3>
                        <div class="search-box">
                            <input type="text" id="friendSearch" placeholder="Tìm kiếm bạn bè...">
                        </div>
                    </div>
                    <div class="friends-list" id="friendsList">
                        <!-- Friends will be loaded here -->
                    </div>
                </div>

                <!-- Requests View -->
                <div id="requests-view" class="view">
                    <div class="view-header">
                        <h3>Lời mời kết bạn</h3>
                    </div>
                    
                    <div class="requests-tabs">
                        <button class="requests-tab-btn active" data-tab="incoming">
                            Lời mời đến
                            <span class="badge" id="incomingBadge">0</span>
                        </button>
                        <button class="requests-tab-btn" data-tab="outgoing">
                            Lời mời đã gửi
                            <span class="badge" id="outgoingBadge">0</span>
                        </button>
                    </div>

                    <div id="incoming-requests" class="requests-list active">
                        <!-- Incoming requests will be loaded here -->
                    </div>

                    <div id="outgoing-requests" class="requests-list">
                        <!-- Outgoing requests will be loaded here -->
                    </div>
                </div>

                <!-- Add Friend View -->
                <div id="add-friend-view" class="view">
                    <div class="view-header">
                        <h3>Thêm bạn bè</h3>
                    </div>
                    <div class="add-friend-container">
                        <div class="search-box large">
                            <input type="text" id="userSearch" placeholder="Tìm kiếm theo email hoặc tên...">
                            <button class="btn btn-primary" id="searchUserBtn">Tìm kiếm</button>
                        </div>
                        <div id="searchResults" class="search-results">
                            <!-- Search results will be loaded here -->
                        </div>
                    </div>
                </div>

                <!-- Profile View -->
                <div id="profile-view" class="view">
                    <div class="view-header">
                        <h3>Hồ sơ của tôi</h3>
                        <button class="btn btn-primary" id="editProfileBtn">
                            <i class="fas fa-edit"></i> Chỉnh sửa
                        </button>
                    </div>
                    
                    <!-- Password Warning for Google Users -->
                    <div id="passwordWarning" class="password-warning" style="display: none;">
                        <div class="warning-icon">
                            <i class="fas fa-exclamation-triangle"></i>
                        </div>
                        <div class="warning-content">
                            <h4>Vui lòng đặt mật khẩu</h4>
                            <p>Bạn đã đăng nhập qua Google. Để tăng cường bảo mật và có thể đăng nhập bằng email, vui lòng đặt mật khẩu cho tài khoản.</p>
                            <form id="setPasswordForm">
                                <div class="form-group">
                                    <label for="newPassword">Mật khẩu mới:</label>
                                    <input type="password" id="newPassword" class="form-input" placeholder="Nhập mật khẩu mới (tối thiểu 6 ký tự)" required minlength="6">
                                </div>
                                <div class="form-group">
                                    <label for="confirmPassword">Xác nhận mật khẩu:</label>
                                    <input type="password" id="confirmPassword" class="form-input" placeholder="Nhập lại mật khẩu" required minlength="6">
                                </div>
                                <button type="submit" class="btn btn-success">
                                    <i class="fas fa-lock"></i> Đặt mật khẩu
                                </button>
                            </form>
                        </div>
                    </div>
                    
                    <div class="profile-container">
                        <div class="profile-avatar-large" id="profileAvatar"></div>
                        
                        <!-- View Mode -->
                        <div class="profile-info" id="profileViewMode">
                            <div class="profile-field">
                                <label>Tên người dùng:</label>
                                <span id="profileUsername"></span>
                            </div>
                            <div class="profile-field">
                                <label>Email:</label>
                                <span id="profileEmail"></span>
                            </div>
                            <div class="profile-field">
                                <label>Vai trò:</label>
                                <span id="profileRole"></span>
                            </div>
                            <div class="profile-field">
                                <label>Tham gia:</label>
                                <span id="profileCreatedAt"></span>
                            </div>
                        </div>
                        
                        <!-- Edit Mode -->
                        <div class="profile-info" id="profileEditMode" style="display: none;">
                            <form id="editProfileForm">
                                <div class="profile-field">
                                    <label>Tên người dùng:</label>
                                    <input type="text" id="editFullName" class="form-input" required>
                                </div>
                                <div class="profile-field">
                                    <label>Avatar URL:</label>
                                    <input type="text" id="editAvatar" class="form-input" placeholder="URL ảnh đại diện (tùy chọn)">
                                </div>
                                <div class="profile-field">
                                    <label>Email:</label>
                                    <span id="profileEmailStatic"></span>
                                    <small style="color: var(--text-secondary);">Email không thể thay đổi</small>
                                </div>
                                <div class="profile-actions">
                                    <button type="submit" class="btn btn-success">
                                        <i class="fas fa-save"></i> Lưu
                                    </button>
                                    <button type="button" class="btn btn-secondary" id="cancelEditBtn">
                                        <i class="fas fa-times"></i> Hủy
                                    </button>
                                </div>
                            </form>
                        </div>
                        
                        <div class="profile-actions">
                            <button class="btn btn-primary" id="editProfileBtn">
                                <i class="fas fa-edit"></i> Chỉnh sửa
                            </button>
                            <button class="btn btn-warning" id="changePasswordBtn">
                                <i class="fas fa-key"></i> Đổi mật khẩu
                            </button>
                            <button class="btn btn-danger" id="logoutBtn">
                                <i class="fas fa-sign-out-alt"></i> Đăng xuất
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Change Password Modal -->
                <div class="modal" id="changePasswordModal" style="display: none;">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h2>Đổi mật khẩu</h2>
                            <button class="modal-close" id="closeChangePasswordModal">&times;</button>
                        </div>
                        <form id="changePasswordForm">
                            <div class="form-group">
                                <label for="currentPasswordInput">
                                    <i class="fas fa-lock"></i> Mật khẩu hiện tại
                                </label>
                                <input type="password" id="currentPasswordInput" class="form-input" 
                                    placeholder="Nhập mật khẩu hiện tại" required minlength="6">
                            </div>
                            <div class="form-group">
                                <label for="newPasswordInput">
                                    <i class="fas fa-key"></i> Mật khẩu mới
                                </label>
                                <input type="password" id="newPasswordInput" class="form-input" 
                                    placeholder="Nhập mật khẩu mới (tối thiểu 6 ký tự)" required minlength="6">
                            </div>
                            <div class="form-group">
                                <label for="confirmNewPasswordInput">
                                    <i class="fas fa-check"></i> Xác nhận mật khẩu mới
                                </label>
                                <input type="password" id="confirmNewPasswordInput" class="form-input" 
                                    placeholder="Nhập lại mật khẩu mới" required minlength="6">
                            </div>
                            <div class="modal-actions">
                                <button type="submit" class="btn btn-success">
                                    <i class="fas fa-save"></i> Đổi mật khẩu
                                </button>
                                <button type="button" class="btn btn-secondary" id="cancelChangePasswordBtn">
                                    <i class="fas fa-times"></i> Hủy
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Chat Panel -->
            <div class="chat-panel" id="chatPanel">
                <div class="chat-header">
                    <div class="chat-user-info">
                        <div class="user-avatar small" id="chatUserAvatar"></div>
                        <div>
                            <h4 id="chatUsername"></h4>
                            <span class="status" id="chatUserStatus">Offline</span>
                        </div>
                    </div>
                    <button class="close-chat" id="closeChatBtn">✕</button>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <!-- Messages will be loaded here -->
                </div>

                <div class="chat-input">
                    <input type="text" id="messageInput" placeholder="Nhập tin nhắn...">
                    <button class="btn btn-primary" id="sendMessageBtn">Gửi</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script type="module" src="js/pages/app.js"></script>

</body>
</html>
