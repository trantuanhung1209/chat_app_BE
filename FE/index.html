<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App - Chào mừng</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .welcome-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        }
        .welcome-container {
            background: var(--bg-primary);
            padding: 60px;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
        }
        .welcome-container h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: var(--primary-color);
        }
        .welcome-container p {
            font-size: 18px;
            color: var(--text-secondary);
            margin-bottom: 40px;
        }
        .welcome-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .welcome-buttons .btn {
            min-width: 150px;
        }
    </style>
</head>
<body>
    <div class="welcome-page">
        <div class="auth-container">
            <div class="auth-tabs">
                <button class="tab-btn active" data-tab="login">Đăng nhập</button>
                <button class="tab-btn" data-tab="register">Đăng ký</button>
            </div>

            <!-- Login Form -->
            <div id="login-form" class="auth-form active">
                <h2>Đăng nhập</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Mật khẩu</label>
                        <input type="password" id="login-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Đăng nhập</button>
                    <div class="divider">HOẶC</div>
                    <button type="button" class="btn btn-google" id="googleLoginBtn">
                        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                        Đăng nhập với Google
                    </button>
                </form>
            </div>

            <!-- Register Form -->
            <div id="register-form" class="auth-form">
                <h2>Đăng ký</h2>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="register-username">Tên người dùng</label>
                        <input type="text" id="register-username" required>
                    </div>
                    <div class="form-group">
                        <label for="register-email">Email</label>
                        <input type="email" id="register-email" required>
                    </div>
                    <div class="form-group">
                        <label for="register-password">Mật khẩu</label>
                        <input type="password" id="register-password" required>
                    </div>
                    <div class="form-group">
                        <label for="register-confirm-password">Xác nhận mật khẩu</label>
                        <input type="password" id="register-confirm-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Đăng ký</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="app-page" class="page">
        <div class="app-container">
            <!-- Sidebar -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <h2>Chat App</h2>
                    <div class="user-info">
                        <div class="user-avatar" id="currentUserAvatar"></div>
                        <span id="currentUsername"></span>
                    </div>
                </div>

                <div class="sidebar-nav">
                    <button class="nav-btn active" data-view="friends">
                        <span>👥</span> Bạn bè
                    </button>
                    <button class="nav-btn" data-view="requests">
                        <span>📬</span> Lời mời
                        <span class="badge" id="requestBadge">0</span>
                    </button>
                    <button class="nav-btn" data-view="add-friend">
                        <span>➕</span> Thêm bạn
                    </button>
                    <button class="nav-btn" data-view="profile">
                        <span>👤</span> Hồ sơ
                    </button>
                </div>

                <button class="logout-btn" id="logoutBtn">Đăng xuất</button>
            </div>

            <!-- Main Content -->
            <div class="main-content">
                <!-- Friends View -->
                <div id="friends-view" class="view active">
                    <div class="view-header">
                        <h3>Danh sách bạn bè</h3>
                        <div class="search-box">
                            <input type="text" id="friendSearch" placeholder="Tìm kiếm bạn bè...">
                        </div>
                    </div>
                    <div class="friends-list" id="friendsList">
                        <!-- Friends will be loaded here -->
                    </div>
                </div>

                <!-- Requests View -->
                <div id="requests-view" class="view">
                    <div class="view-header">
                        <h3>Lời mời kết bạn</h3>
                    </div>
                    
                    <div class="requests-tabs">
                        <button class="requests-tab-btn active" data-tab="incoming">
                            Lời mời đến
                            <span class="badge" id="incomingBadge">0</span>
                        </button>
                        <button class="requests-tab-btn" data-tab="outgoing">
                            Lời mời đã gửi
                            <span class="badge" id="outgoingBadge">0</span>
                        </button>
                    </div>

                    <div id="incoming-requests" class="requests-list active">
                        <!-- Incoming requests will be loaded here -->
                    </div>

                    <div id="outgoing-requests" class="requests-list">
                        <!-- Outgoing requests will be loaded here -->
                    </div>
                </div>

                <!-- Add Friend View -->
                <div id="add-friend-view" class="view">
                    <div class="view-header">
                        <h3>Thêm bạn bè</h3>
                    </div>
                    <div class="add-friend-container">
                        <div class="search-box large">
                            <input type="text" id="userSearch" placeholder="Tìm kiếm theo email hoặc tên...">
                            <button class="btn btn-primary" id="searchUserBtn">Tìm kiếm</button>
                        </div>
                        <div id="searchResults" class="search-results">
                            <!-- Search results will be loaded here -->
                        </div>
                    </div>
                </div>

                <!-- Profile View -->
                <div id="profile-view" class="view">
                    <div class="view-header">
                        <h3>Hồ sơ của tôi</h3>
                    </div>
                    <div class="profile-container">
                        <div class="profile-avatar-large" id="profileAvatar"></div>
                        <div class="profile-info">
                            <div class="profile-field">
                                <label>Tên người dùng:</label>
                                <span id="profileUsername"></span>
                            </div>
                            <div class="profile-field">
                                <label>Email:</label>
                                <span id="profileEmail"></span>
                            </div>
                            <div class="profile-field">
                                <label>Vai trò:</label>
                                <span id="profileRole"></span>
                            </div>
                            <div class="profile-field">
                                <label>Tham gia:</label>
                                <span id="profileCreatedAt"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Chat Panel -->
            <div class="chat-panel" id="chatPanel">
                <div class="chat-header">
                    <div class="chat-user-info">
                        <div class="user-avatar small" id="chatUserAvatar"></div>
                        <div>
                            <h4 id="chatUsername"></h4>
                            <span class="status" id="chatUserStatus">Offline</span>
                        </div>
                    </div>
                    <button class="close-chat" id="closeChatBtn">✕</button>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <!-- Messages will be loaded here -->
                </div>

                <div class="chat-input">
                    <input type="text" id="messageInput" placeholder="Nhập tin nhắn...">
                    <button class="btn btn-primary" id="sendMessageBtn">Gửi</button>
                </div>
            </div>
        </div>
    </div>

        <div class="welcome-container">
            <h1>Chat App</h1>
            <p>Kết nối và trò chuyện với bạn bè</p>
            <div class="welcome-buttons">
                <a href="login.html" class="btn btn-primary">Đăng nhập</a>
                <a href="register.html" class="btn btn-secondary">Đăng ký</a>
            </div>
        </div>
    </div>

    <script type="module">
        import * as api from './js/api.js';
        
        // Check if already logged in
        const tokens = api.getTokens();
        if (tokens.accessToken) {
            window.location.href = 'app.html';
        }
    </script>
</body>
</html>
